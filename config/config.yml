# Example eib workspace config.
#
# Paths (any per-entry 'dir', or a plain entry used as a path when
# --mkosi-dir isn't passed) are resolved relative to this file's own
# directory.
#
# This one is runnable as-is against the bundled example profile:
#   ./eib.py config.yml --mkosi-dir examples/mkosi-dir --dry-run
#
# A config can also pull in other config files instead of listing
# everything in one place:
#
#   include:
#     - common.yml
#
# Included files use this same shape (and may include further files);
# their profiles/images are merged in ahead of this file's own. See
# README.md for details.

# Copied into <workspace>/mkosi.profiles/<name>. A plain string is looked
# up under --mkosi-dir/profiles (pass --mkosi-dir on the command line); a
# mapping can point at its own directory instead, overriding that.
profiles:
  - bianca                     # see examples/mkosi-dir/profiles/bianca
  # - name: vendor-extra       # or specify this entry's own source dir
  #   dir: /srv/shared-mkosi-profiles/vendor-extra

# Copied into <workspace>/mkosi.images/<name>, same rules as profiles,
# looked up under --mkosi-dir/images. Unlike profiles, this list (and
# --mkosi-dir/images itself) is entirely optional.
images: []

# Name and version of the built image, passed to mkosi as --image-id and
# --image-version. Both are optional; without a version, the UTC build
# time (YYYYMMDDHHMMSS, e.g. 20260922164500) is used instead. Quote the
# version so YAML keeps it a string (an unquoted 1.10 would otherwise be
# read as the number 1.1).
image:
  name: elxr-bianca
  version: "1.0"
