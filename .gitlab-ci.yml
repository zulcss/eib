image: python:3.11

stages:
  - lint
  - test

black:
  stage: lint
  before_script:
    - pip install tox
  script:
    - tox -e black

pyflakes:
  stage: lint
  before_script:
    - pip install tox
  script:
    - tox -e pyflakes

test:
  stage: test
  before_script:
    - pip install tox
  script:
    - tox -e test
