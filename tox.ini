[tox]
envlist = black, pyflakes, test

[testenv:black]
description = Check code formatting with black
package = skip
deps = black
commands = black --check --diff src tests

[testenv:format]
description = Reformat code with black
package = skip
deps = black
commands = black src tests

[testenv:pyflakes]
description = Check for lint errors with pyflakes
package = skip
deps = pyflakes
commands = pyflakes src tests

[testenv:test]
description = Run unit tests with pytest
package = editable
deps = pytest
commands = pytest {posargs}
