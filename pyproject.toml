[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eib"
version = "0.1.0"
description = "elxr image builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "click",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
eib = "eib.__main__:main"

[tool.setuptools]
py-modules = ["eib"]
