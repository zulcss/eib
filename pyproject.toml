[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eib"
version = "0.1.0"
description = "elxr image builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
]

[project.scripts]
eib = "eib:main"

[tool.setuptools]
py-modules = ["eib"]
